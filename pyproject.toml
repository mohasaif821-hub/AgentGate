#   Project name, command and metadata updated to AgentGate.
# SPDX-License-Identifier: Apache-2.0
[project]
name = "agentgate"
version = "0.3.1"
description = "AgentGate: least-privilege authorization layer between AI agents and their MCP tools"
authors = [{ name = "mohasaif821-hub" }]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "ai-agents", "security", "policy", "governance", "audit", "nist", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []  # core has ZERO required deps; stdlib only

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]   # only needed to load .yaml policies (JSON works without)
crypto = ["cryptography>=42.0"]  # Ed25519 asymmetric agent identity
dev = ["pytest>=7.0", "pyyaml>=6.0", "cryptography>=42.0"]

[project.urls]
Homepage = "https://github.com/mohasaif821-hub/AgentGate"

[project.scripts]
agentgate = "agentgate.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentgate"]
